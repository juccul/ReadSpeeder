name: Bug report
description: Report reproducible incorrect behavior in ReadSpeeder
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReadSpeeder version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Content type
      options:
        - TXT
        - PDF
        - EPUB
        - Pasted text
        - Not document-related
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Add logs or screenshots after removing personal document content.
